<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prior Authorization Copilot</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header>
  <div><strong>Prior Authorization Copilot</strong> <span class="muted">· synthetic data · decision support only</span></div>
  <label class="toggle">Coverage service:
    <select id="outage">
      <option value="none">Normal</option>
      <option value="a2a">A2A agent down (fallback)</option>
      <option value="full">Full outage (error state)</option>
    </select></label>
</header>
<main>
  <aside id="cases">
    <div class="row"><h2>Cases</h2><button class="secondary" id="new-case-btn">+ New case</button></div>
    <form id="new-case" hidden>
      <label>Synthetic patient</label><select name="patient_id" id="nc-patient"></select>
      <label>Service</label><select name="service_code" id="nc-service"></select>
      <label>Service date</label><input type="date" name="service_date" required>
      <label>Summary (optional)</label><input type="text" name="summary" maxlength="200">
      <p><button type="submit">Create case</button> <span id="nc-msg" class="err"></span></p>
    </form>
    <ul id="case-list"></ul>
  </aside>
  <section id="stream">
    <div class="row"><h2>Live agent activity <span class="muted">(AG-UI)</span></h2>
      <button id="run" disabled>Run investigation</button></div>
    <div id="agents"></div>
    <ol id="events"></ol>
  </section>
  <section id="surface">
    <h2>Review <span class="muted">(A2UI)</span></h2>
    <div id="surface-root"><p class="muted">Select a case and run an investigation.</p></div>
    <details id="audit-box"><summary>Audit trail</summary><ol id="audit"></ol></details>
  </section>
</main>
<script src="/assets/app.js"></script>
</body>
</html>
